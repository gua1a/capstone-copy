<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한림대 통학 마스터</title>
    <!-- 요즘 가장 많이 쓰는 폰트인 'Pretendard' 적용 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        /* 전체 색상 및 폰트 설정 */
        :root {
            --primary-color: #005AAB; /* 한림대 상징색(블루) 톤 */
            --bg-color: #F5F7FA;
        }
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: #333;
        }
        /* 모바일 화면에 딱 맞는 중앙 정렬 컨테이너 */
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
        }
        /* 상단 헤더 (타이틀) */
        .header {
            text-align: center;
            padding: 40px 0 20px 0;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-color);
            margin: 0;
            letter-spacing: -0.5px;
        }
        .header p {
            font-size: 15px;
            color: #666;
            margin-top: 8px;
        }
        /* 검색창 (드롭다운 & 버튼) 영역 */
        .search-box {
            background: white;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            margin-bottom: 20px;
        }
        select {
            width: 100%;
            padding: 16px;
            border: 1.5px solid #E2E8F0;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            outline: none;
            font-family: inherit;
            margin-bottom: 16px;
            appearance: none; /* 기본 화살표 숨김 */
            background: url('data:image/svg+xml;utf8,<svg fill="%23999" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>') no-repeat right 10px center;
            background-color: white;
        }
        select:focus {
            border-color: var(--primary-color);
        }
        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #004585;
        }
        button:active {
            transform: scale(0.98);
        }
        /* 결과 카드 디자인 */
        .result-card {
            background: white;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            margin-bottom: 16px;
        }
        .station-name {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 6px;
            color: #1A202C;
        }
        .walk-info {
            font-size: 14px;
            color: #005AAB;
            font-weight: 600;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #EDF2F7;
        }
        .bus-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
        }
        .bus-no {
            font-size: 16px;
            font-weight: 800;
            color: #2D3748;
            background: #EDF2F7;
            padding: 6px 12px;
            border-radius: 8px;
        }
        .bus-time {
            color: #E53E3E;
            font-weight: 800;
            font-size: 16px;
        }
        .loading {
            text-align: center;
            display: none;
            padding: 30px;
            color: #718096;
            font-weight: 600;
        }
    </style>
        <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=gthv6ddfee"></script>



</head>
<body>
    <div class="container">
        <!-- 메인 타이틀 영역 -->
        <div class="header">
            <h1>🚌 통학 마스터</h1>
            <p>지금 내 건물에서 가장 빨리 타는 버스</p>
        </div>

        <!-- 건물 선택 영역 -->
               <!-- 검색 및 GPS 영역 -->
        <div class="search-box">
            <!-- 1. 건물 직접 선택 (기존 기능) -->
            <select id="building-select">
                <option value="">현재 있는 건물을 선택하세요 (직접 선택)</option>
                {% for name in buildings %}
                <option value="{{ name }}">{{ name }}</option>
                {% endfor %}
            </select>
            
            <!-- 2. 내 위치(GPS) 버튼 -->
            <button onclick="findMyLocation()" style="background-color: #2D3748; margin-bottom: 16px;">
                📍 내 위치 자동 파악하기 (GPS)
            </button>
            
            <!-- 3. 네이버 지도가 그려질 도화지 (처음엔 숨겨둠) -->
            <div id="map" style="width:100%; height:250px; border-radius: 12px; margin-bottom: 16px;"></div>


            <!-- 4. 검색 버튼 -->
            <button onclick="findRoutes()">최단 경로 찾기</button>
        </div>


        <!-- 로딩 애니메이션 텍스트 -->
        <div id="loading" class="loading">
            실시간 버스 정보를 불러오는 중입니다... 🏃‍♂️
        </div>

        <!-- 결과가 출력될 공간 -->
        <div id="result-container"></div>
    </div>

    <script>
        let myLat = 0;
        let myLon = 0;
        let map;
        let marker;
        let watchId; // 실시간 추적을 관리하는 ID

        // 1. 초기 화면: 웹사이트가 열리자마자 한림대 중심 지도를 띄웁니다.
        window.onload = function() {
            // 한림대 캠퍼스라이프센터 대략적 좌표
            const defaultLat = 37.8863; 
            const defaultLon = 127.7381;

            map = new naver.maps.Map('map', {
                center: new naver.maps.LatLng(defaultLat, defaultLon),
                zoom: 16
            });

            marker = new naver.maps.Marker({
                position: new naver.maps.LatLng(defaultLat, defaultLon),
                map: map
            });
        };

        // 2. 실시간 위치 추적: 버튼을 누르면 이동하는 대로 핀이 따라갑니다.
        function findMyLocation() {
            if (navigator.geolocation) {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('loading').innerText = '📍 실시간 위치를 추적합니다...';

                // watchPosition: 위치가 바뀔 때마다 내부 코드가 계속 다시 실행됩니다.
                watchId = navigator.geolocation.watchPosition(function(position) {
                    myLat = position.coords.latitude;
                    myLon = position.coords.longitude;
                    
                    document.getElementById('loading').style.display = 'none';
                    
                    const newLocation = new naver.maps.LatLng(myLat, myLon);
                    
                    // 지도 화면을 내 위치로 부드럽게 이동시키고 핀 위치 변경
                    map.panTo(newLocation);
                    marker.setPosition(newLocation);
                    marker.setAnimation(naver.maps.Animation.BOUNCE);
                    
                }, function(error) {
                    document.getElementById('loading').style.display = 'none';
                    alert("GPS 권한을 허용해주시거나 잠시 후 다시 시도해주세요.");
                }, {
                    enableHighAccuracy: true, // 배터리를 더 쓰더라도 가장 정확한 GPS 좌표 사용
                    maximumAge: 0,
                    timeout: 5000
                });
            } else {
                alert("이 브라우저에서는 GPS를 지원하지 않습니다.");
            }
        }

        // 3. 기존 검색 함수 (수정 없음)
        function findRoutes() {
            const building = document.getElementById('building-select').value;
            if (!building) {
                alert('건물을 먼저 선택해주세요!');
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('result-container').innerHTML = '';

            fetch('/get_route_info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({location: building})
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                const container = document.getElementById('result-container');
                
                if(data.error) {
                    container.innerHTML = `<div class="result-card" style="text-align:center; color:#E53E3E; font-weight:bold;">${data.error}</div>`;
                    return;
                }

                data.forEach(station => {
                    let busHtml = '';
                    if (station.buses.length === 0) {
                        busHtml = '<div class="bus-item" style="color:#A0AEC0; font-weight:600;">도착 예정인 버스가 없습니다.</div>';
                    } else {
                        station.buses.forEach(bus => {
                            busHtml += `
                                <div class="bus-item">
                                    <span class="bus-no">${bus.route}번</span>
                                    <span class="bus-time">${bus.min_left}분 후</span>
                                </div>
                            `;
                        });
                    }

                    const card = `
                        <div class="result-card">
                            <div class="station-name">🚏 ${station.station_name}</div>
                            <div class="walk-info">🚶‍♂️ 도보 ${station.walk_min}분 (${station.walk_dist}m)</div>
                            <div class="bus-list">
                                ${busHtml}
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            })
            .catch(error => {
                document.getElementById('loading').style.display = 'none';
                alert('데이터 통신에 실패했습니다.');
            });
        }

    </script>
</body>
</html>
